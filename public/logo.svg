<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="graphLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="spade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6e9"/>
    </linearGradient>
    <!-- <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"> -->
    <!--   <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/> -->
    <!-- </filter> -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <!-- <circle cx="200" cy="200" r="195" fill="url(#bg)" stroke="#00b894" stroke-width="6"/> -->

  <!-- Ace of Spades overlay -->
  <g transform="translate(50,50) scale(8)"  filter="url(#shadow)">
    <!-- Spade shape -->
    <path d="M32.799 20.336C32.799 11.456 18 .198 18 .198S3.201 11.456 3.201 20.336c0 6.946 8.175 10.172 12.766 5.173C15.631 29.688 11.247 33 7 33h.5a1.5 1.5 0 1 0 0 3h21a1.5 1.5 0 0 0 0-3h.5c-4.246 0-8.632-3.312-8.967-7.491c4.591 4.999 12.766 1.773 12.766-5.173z" fill="#000000" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Trend line -->
  <polyline points="80,270 115,255 150,220 190,230 230,180 270,200 310,130"
    fill="none" stroke="url(#graphLine)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Dots on trend line -->
  <circle cx="80" cy="270" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="115" cy="255" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="150" cy="220" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="190" cy="230" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="230" cy="180" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="270" cy="200" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>
  <circle cx="310" cy="130" r="7" fill="#ffffff" stroke="#00b894" stroke-width="2.5"/>

</svg>

